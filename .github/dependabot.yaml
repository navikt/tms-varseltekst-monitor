version: 2

registries:
  nav-maven:
    type: maven-repository
    url: https://github-package-registry-mirror.gc.nav.no/cached/maven-release

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - nav-maven
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    labels:
      - tms-backend
      - gradle-dependency

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Oslo

    labels:
      - tms-backend