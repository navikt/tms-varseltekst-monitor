name: Deploy revision

on:
  repository_dispatch:
    types: deploy-revision

env:
  COMMIT_SHA: ${{ github.event.client_payload.commit }}

permissions:
  packages: write

jobs:
  build:
    name: Bygg prosjekt og push docker-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - name: Sjekk ut commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Sett opp java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Sett opp gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sett opp pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web-app/package.json

      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'
          cache-dependency-path: 'web-app/pnpm-lock.yaml'

      - name: Bygg prosjekt
        run: ./gradlew assemble

      - name: Installer pnpm dependencies
        run: pnpm install --frozen-lockfile --dir web-app

      - name: Bygg frontend-filer
        run: pnpm --dir web-app build

      - name: Build og push docker-image
        uses: nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: min-side
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}

  deploy:
    name: Deploy til NAIS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        cluster: ${{ github.event.client_payload.clusters }}
    steps:
      - name: Sjekk ut commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: 'Deploy til ${{ inputs.cluster }}'
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: ${{ matrix.CLUSTER }}
          RESOURCE: ./nais/${{ matrix.CLUSTER }}/nais.yaml
          VAR: version=${{ needs.build.outputs.image }}
